<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="تسجيل الدخول, رايتو, أنظمة محاسبية, ERP" />
    <meta
      name="description"
      content="سجل دخولك إلى أنظمة رايتو المحاسبية لإدارة أعمالك بسهولة وكفاءة."
    />
    <meta name="author" content="hadeer hussein" />
    <meta property="og:title" content="تسجيل الدخول - أنظمة رايتو المحاسبية" />
    <meta property="og:type" content="Website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="assets/img/LOGO.png" />
    <link href="assets/img/LOGO.png" rel="shortcut icon" />
    <title>تسجيل الدخول - أنظمة رايتو المحاسبية</title>

    <!-- ✅ Preload للشعار + مقاسات ثابتة -->
    <link
      rel="preload"
      as="image"
      href="assets/img/logoar.webp"
      imagesrcset="assets/img/logoar.webp"
      imagesizes="160px"
    />

    <!-- ✅ Google Fonts مع display=swap -->
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ Bootstrap Lazy load -->
    <link
      rel="preload"
      href="assets/css/bootstrap.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="assets/css/bootstrap.min.css" /></noscript>

    <!-- ✅ Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="assets/css/newCss.css" />

    <!-- ✅ Fix CLS بالـ CSS -->
    <style>
      /* ثبّت مقاس الشعار */
      .logo {
        width: 160px;
        height: 60px;
        max-width: 100%;
      }

      /* ثبّت ارتفاع موحد لعناصر الإدخال */
      input.form-control {
        min-height: 48px;
      }

      button.btn {
        min-height: 48px;
      }
    </style>
  </head>
  <body>
    <section class="content-content py-5">
      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-xl-5 col-md-8 col-12">
            <div class="register-wrap p-4 p-md-5 bg-light-subtle shadow rounded-4">
              <div class="text-center">
                <a href="index.html" aria-label="الذهاب إلى الصفحة الرئيسية">
                  <!-- ✅ Fix CLS للشعار -->
                  <img
                    class="logo"
                    src="assets/img/logoar.webp"
                    alt="شعار رايتو"
                    width="160"
                    height="70"
                    fetchpriority="high"
                  />
                </a>
                <h1 class="section-title2 mb-2 mt-4 fw-semibold">مرحباً بعودتك!</h1>
                <p class="section-subtitle">الرجاء إدخال التفاصيل الخاصة بك</p>
              </div>

              <div class="action-btns">
                <a
                  href="#"
                  class="btn google-btn bg-white shadow-sm mt-4 d-block d-flex align-items-center text-decoration-none justify-content-center p-3 rounded-4 gap-3"
                  aria-label="المتابعة بحساب جوجل"
                >
                  <img src="assets/img/google-icon.svg" alt="أيقونة جوجل" width="24" height="24" />
                  <span>المتابعة من خلال حساب جوجل</span>
                </a>
              </div>

              <div class="position-relative d-flex align-items-center justify-content-center mt-4 py-4">
                <span class="divider-bar"></span>
                <h2 class="position-absolute text-center divider-text bg-light-subtle mb-0">أو</h2>
              </div>

              <form action="#" class="mt-4 register-form">
                <div class="row">
                  <div class="col-sm-12">
                    <label for="email" class="mb-2">البريد الإلكتروني <span class="text-danger">*</span></label>
                    <div class="input-group mb-3">
                      <input
                        type="email"
                        class="form-control"
                        placeholder="ادخل بريدك الإلكتروني"
                        id="email"
                        autocomplete="email"
                        required
                        aria-label="أدخل بريدك الإلكتروني"
                      />
                    </div>
                  </div>

                  <div class="col-sm-12">
                    <label for="password" class="mb-2">كلمة المرور <span class="text-danger">*</span></label>
                    <div class="input-group mb-3">
                      <input
                        type="password"
                        class="form-control"
                        placeholder="ادخل كلمة المرور الخاصة بك"
                        id="password"
                        required
                        aria-label="أدخل كلمة المرور"
                      />
                    </div>
                  </div>

                  <div class="col-12">
                    <button type="submit" class="btn btn-primary mt-3 d-block w-100 rounded-4" aria-label="تسجيل الدخول">
                      تسجيل الدخول
                    </button>
                  </div>
                </div>

                <p class="font-monospace fw-medium text-center text-muted mt-3 pt-4 mb-0">
                  ليس لديك حساب؟
                  <a href="register.html" aria-label="الذهاب إلى صفحة التسجيل">سجل هنا</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="assets/js/bootstrap.bundle.min.js" defer></script>
  </body>
</html>
