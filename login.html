<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="تسجيل الدخول, رايتو, أنظمة محاسبية, ERP" />
    <meta name="description" content="سجل دخولك إلى أنظمة رايتو المحاسبية لإدارة أعمالك بسهولة وكفاءة." />
    <meta name="author" content="hadeer hussein" />
    <meta property="og:title" content="تسجيل الدخول - أنظمة رايتو المحاسبية" />
    <meta property="og:type" content="Website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="assets/img/LOGO.png" />
    <link href="assets/img/LOGO.png" rel="shortcut icon" />
    <title>تسجيل الدخول - أنظمة رايتو المحاسبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/mergedCss.css" />
</head>
<body>
    <section class="content-content py-5">
        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div class="col-xl-5 col-md-8 col-12 p-0">
                    <div class="register-wrap p-4 p-md-5 bg-light-subtle shadow rounded-4">
                        <div class="text-center">
                            <a href="index.html" aria-label="الذهاب إلى الصفحة الرئيسية">
                                <img class="img-fluid" src="./assets/img/logoar.webp" alt="" style="width: 160px;" />
                            </a>
                            <h1 class="section-title2 mb-2 mt-4 fw-semibold">مرحباً بعودتك!</h1>
                            <p class="section-subtitle">
                                الرجاء إدخال التفاصيل الخاصة بك
                            </p>
                        </div>

                        <div class="action-btns">
                            <a href="#" class="btn google-btn bg-white shadow-sm mt-4 d-block d-flex align-items-center text-decoration-none justify-content-center p-3 rounded-4" aria-label="المتابعة بحساب جوجل">
                                <img src="assets/img/google-icon.svg" alt="أيقونة جوجل" />
                                <span>المتابعة من خلال حساب جوجل</span>
                            </a>
                        </div>
                        <div class="position-relative d-flex align-items-center justify-content-center mt-4 py-4">
                            <span class="divider-bar"></span>
                            <h2 class="position-absolute text-center divider-text bg-light-subtle mb-0">أو</h2>
                        </div>
                        <form action="#" class="mt-4 register-form">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="email" class="mb-2">البريد الإلكتروني <span class="text-danger">*</span></label>
                                    <div class="input-group mb-3">
                                        <input type="email" class="form-control" placeholder="ادخل بريدك الإلكتروني" id="email" required aria-label="أدخل بريدك الإلكتروني" />
                                    </div>
                                </div>
                                <div class="col-sm-12">
                                    <label for="password" class="mb-2">كلمة المرور <span class="text-danger">*</span></label>
                                    <div class="input-group mb-3">
                                        <input type="password" class="form-control" placeholder="ادخل كلمة المرور الخاصة بك" id="password" required aria-label="أدخل كلمة المرور" />
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary mt-3 d-block w-100 rounded-4" aria-label="تسجيل الدخول">
                                        تسجيل الدخول
                                    </button>
                                </div>
                            </div>
                            <p class="font-monospace fw-medium text-center text-muted mt-3 pt-4 mb-0">
                                ليس لديك حساب؟
                                <a href="register.html" class="text-decoration-none" aria-label="الذهاب إلى صفحة التسجيل">سجل هنا</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="./assets/js/jquery.js" defer></script>
    <script src="assets/js/owl.carousel.min.js" defer></script>
    <script src="./assets/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js" defer></script>
    <!-- <script src="./assets/js/loade.js" defer></script> -->
</body>
</html>
